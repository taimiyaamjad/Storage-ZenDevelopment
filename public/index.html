    /* =========================================================
       1. CRISP LIGHT THEME SPECIFICATION
       High-contrast, bold, crystal-clear typography (WCAG AAA)
       ========================================================= */
    :root, html:not(.dark), html.light {
      color-scheme: light;
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --border-sidebar: #e2e8f0;

       ========================================================= */

      color-scheme: dark;
      --bg-main: #000000;
      --bg-sidebar: #020202;
      --border-sidebar: #181818;
      --bg-header: rgba(0, 0, 0, 0.92);
      --border-header: #1c1c1c;
      --card-bg: #050505;
      --card-border: #1e1e1e;
      --card-hover-border: #ffffff;
      --text-heading: #ffffff;
      --text-body: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #64748b;
      --input-bg: #000000;
      --input-border: #262626;
      --input-text: #ffffff;
      --nav-inactive-text: #94a3b8;
      --nav-hover-bg: #141414;
      --nav-hover-text: #ffffff;
      --code-bg: #000000;
      --code-text: #ffffff;
      --table-header-bg: #050505;
      --table-row-hover: #0e0e0e;
      --drawer-bg: #000000;
      --drawer-border: #1e1e1e;
      --modal-bg: #060606;
      --scrollbar-thumb: #262626;
      --scrollbar-track: #000000;

    body {
      background-color: var(--bg-main);
      color: var(--text-body);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      position: relative;
    }

    /* ZenCloud Ambient Grounding on Pitch Black */
    html.dark body {
      background-color: #000000 !important;
    }

    /* =========================================================
       OTP VERIFICATION ORBIT, MERGE, RECOIL & RECHARGE ANIMATIONS
       ========================================================= */
    .otp-stage-container {
      position: relative;
      perspective: 1000px;
    }

    .otp-box-slot {
      position: relative;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, border-color 0.3s ease;
      will-change: transform, opacity;
    }

    .otp-input-element {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .otp-input-element:focus {
      transform: translateY(-2px);
    }

    /* 1. Circular Orbit & Merge Sequence */
    .otp-anim-orbit-0 {
      animation: otpOrbitMerge0 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-1 {
      animation: otpOrbitMerge1 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-2 {
      animation: otpOrbitMerge2 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-3 {
      animation: otpOrbitMerge3 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    @keyframes otpOrbitMerge0 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(25px, -55px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(84px, 0px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(84px, 45px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(84px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge1 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(45px, 25px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(28px, 45px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(-20px, -25px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(28px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge2 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(-45px, -25px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(-28px, -45px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(20px, 25px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(-28px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge3 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(-25px, 55px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(-84px, 0px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(-84px, -45px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(-84px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* 2. Central Fusion Core and Tick Success Badge */
    .otp-fusion-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 58px;
      height: 58px;
      margin-top: -29px;
      margin-left: -29px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.2) rotate(0deg);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .otp-fusion-active {
      opacity: 1 !important;
      transform: scale(1) rotate(360deg) !important;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
    }

    .otp-success-glow {
      opacity: 1 !important;
      transform: scale(1.15) rotate(360deg) !important;
      background: #10b981 !important;
      color: #000000 !important;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.6) !important;
    }

    /* 3. Repulsion Effect when OTP is Wrong */
    .otp-anim-repulse-0 {
      animation: otpRepulse0 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-1 {
      animation: otpRepulse1 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-2 {
      animation: otpRepulse2 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-3 {
      animation: otpRepulse3 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }

    @keyframes otpRepulse0 {
      0% {
        transform: translate(84px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(-110px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(-65px, 0) scale(0.95);
      }
      85% {
        transform: translate(-82px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse1 {
      0% {
        transform: translate(28px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(-45px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(-18px, 0) scale(0.95);
      }
      85% {
        transform: translate(-28px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse2 {
      0% {
        transform: translate(-28px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(45px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(18px, 0) scale(0.95);
      }
      85% {
        transform: translate(28px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse3 {
      0% {
        transform: translate(-84px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(110px, 0) scale(1.18);

      }

      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    /* 4. Box Shake on Error */
    .otp-error-shake {
      animation: otpShakeBox 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes otpShakeBox {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .animate-slide-down {
      animation: otpSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    @keyframes otpSlideDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
