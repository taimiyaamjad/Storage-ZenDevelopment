<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VPS SFTP Cloud & S3 Manager</title>
  <meta name="description" content="Production VPS SFTP file manager with AWS S3 & Vercel Blob compatible storage API cluster, interactive installation script, and pitch-black dark interface.">
  <meta property="og:title" content="VPS SFTP Cloud & S3 Manager">
  <meta property="og:description" content="Production VPS SFTP file manager with AWS S3 & Vercel Blob compatible storage API cluster, interactive installation script, and pitch-black dark interface.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Xterm.js Terminal CSS & JS for Admin VPS Console -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pitch: {
              970: '#000000',
              950: '#040405',
              900: '#08080a',
              850: '#0d0d10',
              800: '#141418',
              750: '#1b1b22',
              700: '#23232c',
              600: '#32323f',
            },
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-in': 'scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-glow': 'pulseGlow 2.5s infinite ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.96)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.9' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Pitch Dark Black & Smooth Animations Styling */
    :root {
      color-scheme: dark;
    }

    body {
      background-color: #020203;
      color: #f3f4f6;
    }

    /* Pitch Black Glass Cards */
    .glass-card {
      background: rgba(12, 12, 15, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
    }

    .pitch-card {
      background: #08080a;
      border: 1px solid #1a1a20;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.8);
    }

    .pitch-card-hover {
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pitch-card-hover:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -4px rgba(14, 165, 233, 0.15);
    }

    .pitch-input {
      background-color: #060608 !important;
      border-color: #1e1e24 !important;
      color: #f9fafb !important;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pitch-input:focus {
      border-color: #0ea5e9 !important;
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2) !important;
    }

    /* Ultra-sleek Pitch-Dark Scrollbars */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #23232c;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #040405;
    }

    /* Tab entrance transition */
    .tab-pane-enter {
      animation: tabEnter 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes tabEnter {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Modal entrance transition */
    .modal-backdrop-enter {
      animation: modalFade 0.2s ease-out forwards;
    }
    .modal-box-enter {
      animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Responsive/mobile layout fixes */
    html, body { max-width: 100%; overflow-x: hidden; }
    button, input, select { -webkit-tap-highlight-color: transparent; }
    #file-context-menu { max-width: calc(100vw - 16px); }
    .admin-table-scroll, .file-table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    
    /* Side preview drawer */
    #file-preview-drawer {
      width: min(540px, 94vw);
      max-height: 100vh;
      background: #060608;
      border-left: 1px solid #1a1a22;
      box-shadow: -10px 0 40px rgba(0,0,0,0.9);
    }
    .preview-media {
      max-width: 100%;
      max-height: calc(100vh - 150px);
      object-fit: contain;
      border-radius: 0.75rem;
    }
    @media (max-width: 767px) {
      #file-preview-drawer {
        width: 100vw;
      }
      #sidebar { padding: 0.75rem; border-right: 0; border-bottom: 1px solid #1a1a22; }
      #sidebar .brand-block { margin-bottom: .5rem; padding: .35rem .25rem; }
      #sidebar .desktop-quota { display: none; }
      #sidebar nav { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .2rem; scrollbar-width: none; }
      #sidebar nav::-webkit-scrollbar { display: none; }
      #sidebar nav > button, #sidebar nav > div { flex: 0 0 auto; }
      #sidebar nav > button { width: auto; white-space: nowrap; }
      #sidebar nav > div { display: flex; align-items: center; gap: .4rem; padding: 0; margin: 0; border: 0; }
      #sidebar nav > div > span { display:none; }
      #sidebar nav > div > button { width: auto; white-space: nowrap; }
      #mobile-account { display: flex; padding-top: .6rem; margin-top: .5rem; border-top: 1px solid #1a1a22; }
      #main-header { padding: .75rem 1rem; }
      #tab-content-area { padding: .75rem; }
      .mobile-stack { flex-direction: column !important; align-items: stretch !important; }
      .mobile-full { width: 100% !important; }
    }
  </style>
</head>
<body class="bg-[#020203] text-neutral-100 min-h-screen font-sans antialiased custom-scrollbar selection:bg-sky-500 selection:text-black">

  <div id="app"></div>

  <!-- SPA Core Application Logic Script -->
  <script src="/app.js"></script>
</body>
</html>
